# Silicon Dreams · Module 1 · CM-HW-101-M1
# ChipMango × ChipFoundry course starter — learners replace author with their name.
project:
  title:        "Silicon Dreams M1 — Elevator Controller"
  author:       "<your name here>"           # Replace before shuttle submission.
  discord:      ""                           # Optional.
  description:  "9-floor elevator FSM with 7-segment display — CM-HW-101-M1 course starter."
  language:     "Verilog"
  clock_hz:     50000000                     # 50 MHz, 20 ns period.

  # A single 1x1 tile is sufficient for this design.
  tiles: "1x1"

  # Top module name. Rename to tt_um_<your-handle>_elevator for production submissions.
  top_module:  "tt_um_example"

  # Source files (relative to ./src).
  source_files:
    - "elevator.v"

# Pinout — reflects the Mango Tower elevator contract.
pinout:
  # Inputs — one-hot button panel.
  ui[0]: "floor1"
  ui[1]: "floor2"
  ui[2]: "floor3"
  ui[3]: "floor4"
  ui[4]: "floor5"
  ui[5]: "floor6"
  ui[6]: "floor7"
  ui[7]: "floor8"

  # Outputs — 7-segment display + idle indicator on bit 7.
  uo[0]: "seg_a"
  uo[1]: "seg_b"
  uo[2]: "seg_c"
  uo[3]: "seg_d"
  uo[4]: "seg_e"
  uo[5]: "seg_f"
  uo[6]: "seg_g"
  uo[7]: "idle_dp"                           # Decimal point = idle indicator.

  # Bidirectional pins — unused in Module 1. Re-claimed in Module 3 for AXIOM arbitration.
  uio[0]: "nc"
  uio[1]: "nc"
  uio[2]: "nc"
  uio[3]: "nc"
  uio[4]: "nc"
  uio[5]: "nc"
  uio[6]: "nc"
  uio[7]: "nc"

# Do not change!
yaml_version: 6
